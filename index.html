<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- ピンチ拡大は許可する（user-scalable=no / maximum-scale は入れない） -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="color-scheme" content="dark" />
    <meta name="app-id" content="__APP_ID__" />
    <meta name="description" content="スマートフォンで遊べる、1 ステージのブロック崩し" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iPhone のホーム画面アプリ: ステータスバーを不透明（black）にする。透明だと、画面の上端で、
         ステータスバーの下に入った内容を iOS がぼかして、文字が読みにくくなる -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ブロック崩し" />
    <title>ブロック崩し - タイトル</title>
  </head>
  <body data-screen="title">
    <main id="app">
      <!-- タイトル（GUI-0002） -->
      <section id="screen-title" class="screen title" aria-labelledby="title-logo">
        <h1 id="title-logo" class="logo">BREAKOUT</h1>
        <div class="logo-blocks" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <nav class="menu" aria-label="メニュー">
          <button id="title-start" type="button" class="primary start">START</button>
          <button id="title-ranking" type="button">RANKING</button>
        </nav>
      </section>

      <!-- プレイ（GUI-0003・GUI-0004） -->
      <section id="screen-play" class="screen" aria-label="プレイ" hidden>
        <p id="orientation-notice" class="notice" hidden>縦向きでのプレイをおすすめします</p>
        <!-- Canvas と結果パネルを重ねる箱 -->
        <div id="stage" class="stage">
          <canvas id="field" role="img" aria-label="ブロック崩しのゲーム画面" tabindex="0"></canvas>
          <div id="result-panel" class="result-panel" role="region" aria-labelledby="result-heading" hidden></div>
        </div>
        <div class="play-controls"></div>
      </section>

      <!-- ランキング（GUI-0005） -->
      <section id="screen-ranking" class="screen" aria-labelledby="ranking-heading" hidden>
        <h2 id="ranking-heading" tabindex="-1">ハイスコアランキング</h2>
      </section>
    </main>

    <!-- 読み上げの通知領域（GUI-0001 §6） -->
    <div id="announcer" class="sr-only" aria-live="polite"></div>

    <!-- ダイアログ・帯（インストール方法・更新・起動の復旧は TASK-0002、読み込みの確認は TASK-0021 で置く） -->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
