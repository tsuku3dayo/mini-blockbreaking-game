# PR と main への push で、検査とテストを行う（TD-0001 §6）
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint → check:docs → 単体テスト → build → check:dist
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  # 画面のテスト（Pixel 7 と 375 × 667 の 2 つのプロジェクト）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --with-deps（apt での OS の部品の取得）は途中で止まることがあった。ubuntu-latest には Chromium に
      # 要る部品がそろっているので、ブラウザだけを入れる。取得が止まったときに備え、4 分で打ち切って 3 回まで試す
      - name: Install Playwright browser
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install chromium && exit 0
            echo "Playwright install attempt $i failed or timed out; retrying"
          done
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
